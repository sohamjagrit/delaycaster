[project]
name = "delaycaster"
version = "0.1.0"
description = "DelayCast — US domestic flight delay prediction (Streamlit demo over an AzureML-trained champion)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Pinned to the AzureML training stack (azureml/conda_train.yml) so the committed
# champion pickle (app/_model/.../model.pkl) unpickles and predicts identically —
# a scikit-learn/lightgbm drift silently breaks the OneHotEncoder.
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.22",
    "scikit-learn==1.3.2",
    "lightgbm==4.3.0",
    "pandas==2.1.4",
    "pyarrow==14.0.2",
    "joblib>=1.3",
]

[dependency-groups]
# Local data/asset prep + Azure control plane (not needed to run the app).
dev = [
    "azure-ai-ml>=1.20",
    "azure-identity>=1.17",
    "mlflow>=2.12",
    "xgboost>=2.0",
]

[tool.uv]
# requirements.txt stays the deploy manifest for Streamlit Community Cloud, which does
# NOT read pyproject/uv. Keep it in sync from this lock with:
#   uv export --no-hashes --no-dev -o requirements.txt
package = false
